[package]
name = "zetaprint"
version = "0.1.0"
edition = "2021"
authors = ["ZetaPrint Team"]

[workspace]
resolver = "2"
members = [
    "crates/core_api",
    "crates/core_ipp",
    "crates/core_accounting",
    "crates/core_dispatcher",
    "crates/core_db",
    "crates/core_auth",
    "crates/core_identity",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ZetaPrint Team"]

[workspace.dependencies]
# Async & Core
tokio = { version = "1.36", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"

# Web
axum = { version = "0.7", features = ["multipart"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate", "macros"] }

# Security & Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
jsonwebtoken = "9.3"
clap = { version = "4.5", features = ["derive"] }
mime_guess = "2.0"

# Print & Parsing
ipp = "6.0"
lopdf = "0.31"
rust-embed = { version = "8.2", features = ["interpolate-folder-path"] }

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
clap = { workspace = true }
core_api = { path = "crates/core_api" }
core_ipp = { path = "crates/core_ipp" }
core_accounting = { path = "crates/core_accounting" }
core_dispatcher = { path = "crates/core_dispatcher" }
core_db = { path = "crates/core_db" }
core_auth = { path = "crates/core_auth" }
